min_version: 1.12.2

output:
  - summary
  - failure
  - execution_out

pre-commit:
  parallel: true
  commands:
    "fix:rector":
      priority: 1
      run: ./vendor/bin/rector process --no-progress-bar {staged_files}
      glob: "*.php"
      stage_fixed: true
    "fix:php":
      priority: 2
      run: ./vendor/bin/pint {staged_files}
      glob: "*.php"
      stage_fixed: true
      # A standalone script parsing bytes, which Pint would move to mb_* functions.
      # Pint ignores its notPath for files passed by name.
      exclude:
        - tests/Support/fake-redis-server.php

# No pre-push hook: PHPStan, type coverage, and the test suite run in CI behind
# the required gate, so a pre-push pass would duplicate that enforcement while
# adding push latency and hard-failing in environments without dev dependencies
# installed.
